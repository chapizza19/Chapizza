<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAPIZZA VIP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 color:white;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at 50% 35%,#420606,#160303 45%,#030303);
}
body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 opacity:.25;
 background:repeating-linear-gradient(135deg,transparent 0 65px,#7b0808 67px,transparent 70px);
}
header{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:18px 14px;
 border-bottom:2px solid #a50000;
}
.topbtn{
 width:48px;height:48px;
 border:1px solid #c21b1b;
 border-radius:12px;
 color:#ff2929;
 background:#160707;
 font-size:25px;
}
.logo{
 font-size:clamp(23px,7vw,45px);
 font-weight:1000;
 font-style:italic;
 letter-spacing:2px;
 color:#eee;
 text-shadow:3px 4px #9e0000,0 0 18px red;
}
main{
 position:relative;
 width:92%;
 max-width:650px;
 margin:25px auto;
}
.welcome{
 display:grid;
 grid-template-columns:1fr 1.5fr;
 gap:15px;
 align-items:center;
 padding:15px;
 border:2px solid #a90000;
 border-radius:15px;
 background:linear-gradient(130deg,#160606,#030303);
 box-shadow:0 0 18px #87000055;
}
.photo{
 display:block;
 width:100%;
 height:190px;
 object-fit:cover;
 object-position:center;
 border:2px solid #d00000;
 border-radius:12px;
 box-shadow:0 0 15px #c00000;
}
.welcome h2{
 font-size:clamp(20px,5vw,35px);
 margin:0;
 text-align:center;
}
.welcome h2 span{
 display:block;
 color:#f01818;
 font-size:1.25em;
 font-style:italic;
 text-shadow:0 0 12px #a00000;
}
.vip{
 text-align:center;
 letter-spacing:6px;
 color:#bbb;
 margin-top:12px;
}
.login{
 margin-top:20px;
 padding:24px 18px;
 text-align:center;
 border:2px solid #b00000;
 border-radius:16px;
 background:linear-gradient(140deg,#170606,#030303);
 box-shadow:0 0 20px #8b000055;
}
.login h3{
 margin:0 0 15px;
 font-size:23px;
 letter-spacing:2px;
}
.keybox{
 display:flex;
 align-items:center;
 gap:10px;
}
.lock{font-size:35px}
input{
 width:100%;
 min-width:0;
 padding:17px 10px;
 color:white;
 background:#080808;
 border:1px solid #777;
 border-radius:10px;
 font-size:17px;
 text-align:center;
 letter-spacing:3px;
}
.unlock{
 width:100%;
 margin-top:18px;
 padding:17px 8px;
 color:white;
 font-weight:1000;
 font-size:clamp(19px,5vw,27px);
 letter-spacing:3px;
 border:2px solid #ff3333;
 border-radius:40px;
 background:linear-gradient(#ed1717,#650000);
 box-shadow:0 0 15px #bd0000;
}
.status{
 margin:18px 0 0;
 color:#aaa;
 font-size:15px;
}
.dot{
 display:inline-block;
 width:12px;height:12px;
 margin-right:8px;
 border-radius:50%;
 background:red;
 box-shadow:0 0 10px red;
}
footer{
 text-align:center;
 margin:35px 0 20px;
 color:#bbb;
 letter-spacing:7px;
 font-size:15px;
}
@media(max-width:430px){
 .welcome{grid-template-columns:1fr 1.3fr;padding:12px}
 .photo{height:155px}
 .vip{letter-spacing:4px}
 header{padding:14px 10px}
 .topbtn{width:43px;height:43px}
}
</style>
</head>
<body>
<header>
 <button class="topbtn" aria-label="Menú">☰</button>
 <div class="logo">♛ CHAPIZZA</div>
 <button class="topbtn" aria-label="Configuración">⚙</button>
</header>

<main>
 <section class="welcome">
  <img class="photo" src="owner.jpeg" alt="Fotografía del OWNER">
  <div>
   <h2>BIENVENIDO A
    <span>CHAPIZZA</span>
   </h2>
   <div class="vip">• PANEL VIP •</div>
  </div>
 </section>

 <section class="login">
  <h3>INGRESA TU KEY</h3>
  <div class="keybox">
   <span class="lock">🔒</span>
   <input id="key" type="password" placeholder="XXXX-XXXX-XXXX">
  </div>
  <button class="unlock" onclick="desbloquear()">
   🔑 DESBLOQUEAR
  </button>
  <p class="status" id="estado">
   <span class="dot"></span>Estado: Esperando KEY...
  </p>
 </section>

 <footer>CHAPIZZA · V1.0</footer>
</main>

<script>
function desbloquear(){
 const key=document.getElementById("key").value.trim();
 const estado=document.getElementById("estado");

 if(!key){
  estado.textContent="Ingresa tu KEY para continuar.";
  return;
 }

 estado.textContent="La validación segura de KEY aún no está conectada.";
}
</script>
</body>
</html>
